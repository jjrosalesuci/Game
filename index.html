<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LG Caribbean Platformer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09131f;
      --panel: rgba(7, 22, 35, 0.88);
      --accent: #f5c542;
      --text: #f4f7fb;
      --muted: #b8c5d1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #174a70 0%, #09131f 60%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }
    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    canvas {
      width: min(100vw, 1280px);
      height: min(100vh, 720px);
      border: 2px solid rgba(255,255,255,0.08);
      background: linear-gradient(180deg, #7cd3ff 0%, #6be0f0 45%, #1c5970 100%);
      image-rendering: pixelated;
      box-shadow: 0 16px 40px rgba(0,0,0,0.45);
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .panel {
      pointer-events: auto;
      min-width: 360px;
      max-width: 720px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 14px 38px rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
    }
    .panel h1, .panel h2, .panel p { margin-top: 0; }
    .menu-buttons { display: grid; gap: 12px; }
    button, input[type="range"] {
      width: 100%;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      background: linear-gradient(180deg, #f5c542, #d58e17);
      color: #1f1807;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.2s ease;
    }
    button:hover { filter: brightness(1.06); }
    button:active { transform: translateY(1px); }
    .secondary { background: #264b61; color: var(--text); }
    .row { display: flex; gap: 12px; align-items: center; }
    .hidden { display: none !important; }
    .option-row { margin-bottom: 14px; }
    .small { color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="gameCanvas" width="1280" height="720" aria-label="LG Caribbean Platformer"></canvas>
    <div id="ui-root" class="overlay"></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
